  <script>
    // Purge all legacy caches on page load
    if ('caches' in window) {
      caches.keys().then(keys => {
        keys.forEach(k => {
          caches.delete(k).catch(() => {});
        });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const basePrefix = window.location.pathname.includes('/3marh/') ? '/3marh/' : '/';
          const registration = await navigator.serviceWorker.register(basePrefix + 'sw.js', { scope: basePrefix });
          registration.update().catch(() => {});

          console.warn('SW registration failed:', err);
        }
      });
    }
