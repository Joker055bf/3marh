<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متابعة عقاراتي</title>
  
  <!-- Icons and install info live in public/ and are served as-is (absolute paths are not renamed by the build). -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="عقاراتي">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    // Anti-flicker script for dark mode
    if (localStorage.getItem('rentals_theme') === 'dark' || (!('rentals_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</head>
<body>
  
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  
  <script type="module" src="./index.tsx"></script>
  
  <script>
    // Purge all legacy caches on page load
    if ('caches' in window) {
      caches.keys().then(keys => {
        keys.forEach(k => {
          caches.delete(k).catch(() => {});
        });
      }).catch(() => {});
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const basePrefix = '%BASE_URL%';
          const registration = await navigator.serviceWorker.register(basePrefix + 'sw.js', { scope: basePrefix });
          registration.update().catch(() => {});
        } catch (err) {
          console.warn('SW registration failed:', err);
        }
      });
    }
  </script>
</body>
</html>
