<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متابعة عقاراتي — انتقلنا</title>
  <script>
    // The app moved to Vercel. Keep the page the user was on: /3marh/<path> -> https://3marh.vercel.app/<path>
    (function () {
      var path = location.pathname.replace(/^\/3marh\/?/, '');
      var target = 'https://3marh.vercel.app/' + path + location.search + location.hash;
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
      }
      location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="2;url=https://3marh.vercel.app/">
  <style>body{font-family:Cairo,Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f8fafc;color:#334155;text-align:center}a{color:#2563eb;font-weight:bold}</style>
</head>
<body>
  <p>انتقل التطبيق إلى عنوان جديد:<br><a href="https://3marh.vercel.app/">3marh.vercel.app</a></p>
</body>
</html>
